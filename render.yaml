# ==============================================================================
# Render Blueprint Specification for AttendX Infrastructure
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: attendx-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SUPABASE_DB_URL
        sync: false # Set via Render Dashboard: jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require
      - key: SUPABASE_DB_USERNAME
        sync: false # Set via Render Dashboard: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false # Set securely in Render environment variables
      - key: SUPABASE_JWT_SECRET
        sync: false # Project Settings > API > JWT Secret from Supabase Dashboard
      - key: SUPABASE_URL
        sync: false # https://<ref>.supabase.co
      - key: MOCK_TOKENS_ENABLED
        value: "false" # Strictly disabled in production
      - key: SHOW_SQL
        value: "false"
      - key: APP_ALLOWED_ORIGINS
        value: "https://attendx-vstudy.web.app,https://lifeledger-29015.web.app,https://attendx-backend.onrender.com,https://vstudy.saveetha.com"

