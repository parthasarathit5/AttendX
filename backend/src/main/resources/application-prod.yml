# ==============================================================================
# AttendX Backend - Production Configuration Profile (prod)
# Targeted for Cloud Deployment on Render + Supabase PostgreSQL
# ==============================================================================

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

spring:
  application:
    name: attendx-backend-prod

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AttendXSupabaseHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      auto-commit: true
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

attendx:
  institution:
    id: ${INSTITUTION_ID:inst-sse-001}
  attendance:
    default-threshold: 75.0
    debarred-threshold: 65.0
    exam-fee-amount: 1500
  security:
    jwt-issuer: ${SUPABASE_JWT_ISSUER}
    jwks-url: ${SUPABASE_JWKS_URL}
    jwt-secret: ${SUPABASE_JWT_SECRET}
    mock-tokens-enabled: false
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:https://attendx-vstudy.web.app,https://attendx.onrender.com,https://vstudy.saveetha.com}

