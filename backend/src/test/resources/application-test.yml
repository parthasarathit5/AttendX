spring:
  application:
    name: attendx-backend-test
  datasource:
    url: jdbc:h2:mem:attendx_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

attendx:
  institution:
    id: inst-sse-001
  attendance:
    default-threshold: 75.0
    debarred-threshold: 65.0
  security:
    mock-tokens-enabled: true

